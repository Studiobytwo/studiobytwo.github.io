<body data-mode="boot" data-zoom="wide">
  <a class="skip-link" href="#site-links">Skip to links</a>

  <!-- Loading screen. Progress is driven by real loading steps (see js/main.js). -->
  <section id="boot" class="boot" aria-label="Loading Studio by Two">
    <div class="boot-inner">
      <p class="boot-title">Studio by Two</p>
      <ul id="boot-log" class="boot-log" aria-live="polite"></ul>
      <p id="boot-status" class="boot-status">Starting…</p>
      <div class="boot-progress" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="boot-bar"></span>
      </div>
      <button id="boot-skip" class="boot-skip" type="button">Skip</button>
    </div>
  </section>

  <!-- The 3D room (canvas) and the StudioOS screen (CSS 3D layer on top). -->
  <div id="room-stage" class="room-stage"></div>
  <div id="css-stage" class="css-stage"></div>

  <!-- Fallback: phones, no WebGL, or reduced motion. StudioOS fills the screen. -->
  <div id="fallback-host" class="fallback-host"></div>

  <div class="hud">
    <p class="hud-brand">Studio by Two</p>
    <button id="sound-toggle" class="hud-btn" type="button" aria-pressed="false">Sound: off</button>
    <div class="hud-tools">
      <button id="btn-lamp" class="hud-btn" type="button" aria-pressed="true">Switch lamp off</button>
      <button id="btn-monitor" class="hud-btn" type="button">Zoom to screen</button>
    </div>
    <button id="btn-back" class="hud-btn hud-back" type="button" hidden>← Back to room</button>
    <p id="hint" class="hud-hint">Click the monitor to step in. Click the lamp to switch it.</p>
  </div>
